server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal resolver — required for dynamic upstream vars
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── ClinicalTrials.gov proxy ──────────────────────────────────────────────
    # Uses a variable so nginx resolves the host at request-time (not startup)
    location /ct-api/ {
        set $ct_host "clinicaltrials.gov";
        proxy_pass          https://$ct_host/api/v2/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols  TLSv1.2 TLSv1.3;
        proxy_set_header     Host               clinicaltrials.gov;
        proxy_set_header     X-Real-IP          "";
        proxy_set_header     X-Forwarded-For    "";
        proxy_hide_header    X-Frame-Options;
        add_header           Access-Control-Allow-Origin  *;
        add_header           Access-Control-Allow-Headers "Content-Type,Accept";
    }

    # ── Model registry backend ────────────────────────────────────────────────
    location /api/ {
        proxy_pass       http://backend:3001/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        add_header       Cache-Control     "no-store";
    }
}

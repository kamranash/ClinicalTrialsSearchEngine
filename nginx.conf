server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal resolver — required for dynamic upstream vars
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── ClinicalTrials.gov proxy ──────────────────────────────────────────────
    # rewrite+break forces explicit path rewrite before proxy_pass sees it
    # (variables in proxy_pass disable nginx automatic path substitution)
    location /ct-api/ {
        rewrite ^/ct-api/(.*)$ /api/v2/$1 break;
        proxy_pass          https://clinicaltrials.gov;
        proxy_ssl_server_name on;
        proxy_ssl_protocols  TLSv1.2 TLSv1.3;
        proxy_set_header     Host               clinicaltrials.gov;
        proxy_set_header     X-Real-IP          "";
        proxy_set_header     X-Forwarded-For    "";
        proxy_hide_header    X-Frame-Options;
        add_header           Access-Control-Allow-Origin  *;
        add_header           Access-Control-Allow-Headers "Content-Type,Accept";
    }

    # ── Model registry backend ────────────────────────────────────────────────
    # Variable forces runtime DNS resolution via resolver 127.0.0.11
    location /api/ {
        set $backend "http://backend:3001";
        proxy_pass       $backend/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        add_header       Cache-Control     "no-store";
    }
}
